<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memória Climática</title>
<style>
  :root{
    --ink:#0f2f44; --soft:#4b6a7d; --blue:#f97316; --blue2:#fb923c; --deep:#c2410c;
    --ok:#16a34a; --err:#dc2626; --paper:#fffdf5; --line:#dbe7ee;
    --cols:4; --cw:96px; --gap:12px; --fs:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    min-height:100vh;color:var(--ink);background:#ffffff;
    display:flex;flex-direction:column;align-items:center;padding:12px 14px 40px;
  }
  .top{width:100%;max-width:1040px;display:flex;justify-content:flex-start}
  .hub{display:inline-flex;align-items:center;gap:6px;color:var(--deep);text-decoration:none;
    font-weight:600;font-size:.9rem;padding:7px 12px;border-radius:20px;border:1.5px solid var(--line)}
  .hub:hover{background:#f0f9ff}
  .hub svg{width:14px;height:14px}
  header{text-align:center;max-width:720px;margin-top:6px}
  h1{font-size:clamp(1.45rem,5vw,2.2rem);display:flex;align-items:center;justify-content:center;gap:10px}
  h1 svg{width:.9em;height:.9em}
  h1 .spark{color:var(--blue)}
  .sub{color:var(--soft);font-size:.95rem;margin:4px 0 12px}
  .levels{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
  .levels button{
    border:2px solid var(--line);background:#fff;color:var(--ink);
    padding:8px 16px;border-radius:30px;font-size:.92rem;cursor:pointer;transition:.2s;font-weight:600;font-family:inherit;
  }
  .levels button.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .hud{display:flex;gap:18px;justify-content:center;margin:4px 0 12px;font-size:.95rem;flex-wrap:wrap;color:var(--soft)}
  .hud b{color:var(--deep)}
  .hud{align-items:center}
  .mini{border:2px solid var(--line);background:#fff;color:var(--deep);padding:5px 12px;border-radius:20px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit}
  .mini:hover{background:#f0f9ff}

  /* mesa clara, com veios de madeira */
  .mesa{
    padding:22px;border-radius:24px;max-width:100%;position:relative;z-index:1;isolation:isolate;
    background-image:
      repeating-linear-gradient(91deg,rgba(150,100,40,.07) 0 2px,transparent 2px 23px),
      repeating-linear-gradient(89deg,rgba(150,100,40,.04) 0 1px,transparent 1px 9px),
      linear-gradient(180deg,#f9efd9,#f2e1bf);
    box-shadow:inset 0 0 0 3px #e6cf9f, inset 0 0 0 9px rgba(255,255,255,.35), 0 10px 26px rgba(15,47,68,.10);
  }
  .board{position:relative;width:var(--tw,300px);height:var(--th,300px);max-width:100%}

  .card{
    position:absolute;left:0;top:0;z-index:var(--z,1);
    width:var(--cw);height:calc(var(--cw)*1.32);border:0;background:none;padding:0;font-family:inherit;
    perspective:700px;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;
    transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg)) scale(var(--s,1));
    transition:transform .18s ease;
  }
  /* arremesso: a carta sai da mao do jogador, gira e desliza ate parar */
  .card.deal{animation:throw .6s cubic-bezier(.14,.78,.28,1) backwards;animation-delay:var(--d,0ms)}
  @keyframes throw{
    0%{opacity:0;transform:translate(var(--sx,0px),var(--sy,0px)) rotate(calc(var(--r,0deg) - 230deg)) scale(.9)}
    14%{opacity:1}
    82%{transform:translate(var(--x,0px),var(--y,0px)) rotate(calc(var(--r,0deg) + 5deg)) scale(1.02)}
  }
  @media(hover:hover){.card:hover{--s:1.04}}
  .card:focus-visible{--s:1.04;outline:none}
  .card:focus-visible .inner{box-shadow:0 0 0 3px var(--blue)}
  .card.flip{z-index:9000;transform:translate(var(--x,0px),var(--y,0px)) rotate(calc(var(--r,0deg)*.25)) scale(1.07)}
  .card.matched{z-index:0;transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg)) scale(1)}
  .card.drag{transition:none;cursor:grabbing;z-index:9500;--s:1.1}
  .card.drag.flip,.card.drag.matched{transform:translate(var(--x,0px),var(--y,0px)) rotate(calc(var(--r,0deg)*.25)) scale(1.1)}
  .card.drag .face{box-shadow:0 14px 26px rgba(15,47,68,.30)}
  .inner{position:relative;width:100%;height:100%;transition:transform .42s;transform-style:preserve-3d;border-radius:10px}
  .card.flip .inner,.card.matched .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    box-shadow:0 3px 0 rgba(15,47,68,.10),0 6px 12px rgba(15,47,68,.18);overflow:hidden;
  }
  .front{
    background:
      radial-gradient(circle at 50% 50%,rgba(255,255,255,.0) 0 34%,rgba(255,255,255,.16) 35% 37%,transparent 38%),
      repeating-linear-gradient(45deg,rgba(255,255,255,.13) 0 6px,transparent 6px 12px),
      linear-gradient(150deg,var(--blue2),var(--blue));
    border:4px solid #fff;
  }
  .front svg{width:38%;height:auto}
  .back{transform:rotateY(180deg);color:var(--ink);font-size:var(--fs);line-height:1.18;font-weight:600;padding:6%;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
  .back.term{background:#fff;border:2px solid #bae6fd;justify-content:space-between;padding:7% 5% 8%}
  .back.term .art{width:74%;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .back.term .art svg{width:100%;height:100%;max-height:100%}
  .back.term .lbl{font-weight:800;font-size:calc(var(--fs)*1.06);color:var(--deep);line-height:1.1;max-width:100%;flex:none;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
  .back.def{background:var(--paper);border:2px solid #f0d9a4}
  .back.def::before{content:"";position:absolute;left:0;right:0;top:0;height:7%;background:#f6d98a}
  .card.matched .back{border-color:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.35),0 6px 12px rgba(15,47,68,.14)}
  .card.wrong .back{border-color:var(--err)}

  /* leitor: mostra por extenso o texto das cartas abertas */
  .reader{
    position:sticky;bottom:10px;z-index:6;margin-top:14px;width:min(640px,100%);
    background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;
    font-size:1rem;line-height:1.35;min-height:76px;box-shadow:0 8px 22px rgba(15,47,68,.14);
  }
  .reader .row{display:flex;gap:8px;align-items:baseline}
  .reader .row + .row{margin-top:4px}
  .reader .tag{flex:none;font-size:.72rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    padding:2px 7px;border-radius:8px;background:#ffedd5;color:var(--deep)}
  .reader .tag.d{background:#fdf0c9;color:#8a5a00}
  .reader .msg{margin-top:6px;font-weight:700}
  .reader .msg.ok{color:var(--ok)} .reader .msg.no{color:var(--err)}
  .reader .hint{color:var(--soft);font-weight:400;font-size:.88rem}
  .reader .exp{color:var(--soft);margin-top:4px}

  .win{display:none;margin-top:16px;width:min(640px,100%);background:#f0fdf4;border:2px solid #86efac;
    border-radius:16px;padding:18px;text-align:center}
  .win.show{display:block}
  .win h2{font-size:1.3rem;margin-bottom:6px;color:#166534}
  .savebox{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .savebox input{padding:10px 12px;border-radius:10px;border:2px solid var(--line);font-size:1rem;width:220px;font-family:inherit}
  .btn{background:var(--blue);color:#fff;border:0;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.95rem;font-family:inherit}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--line)}

  .ranking{margin-top:16px;width:min(640px,100%);background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px}
  .ranking h3{font-size:1.02rem;margin-bottom:8px}
  .ranking h3 span{color:var(--blue)}
  .ranking ol{list-style:none}
  .ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.93rem}
  .ranking li:last-child{border-bottom:0}
  .ranking .pos{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
  .note{font-size:.8rem;color:var(--soft);margin-top:6px}
  footer{margin-top:22px;font-size:.8rem;color:var(--soft);text-align:center;line-height:1.6}
  footer .credit{font-weight:700;color:var(--ink)}

  @media(max-width:560px){
    body{padding:8px 8px 32px}
    .mesa{padding:12px;border-radius:18px}
    .sub{display:none}
    header{margin-top:2px}
    h1{margin-bottom:8px}
    .hub{padding:4px 10px;font-size:.82rem}
    .levels{margin-bottom:6px}
    .hud{gap:10px;font-size:.86rem;margin:2px 0 8px}
    .mini{padding:3px 10px;font-size:.8rem}
    .reader{min-height:64px;font-size:.86rem;padding:8px 12px;margin-top:10px}
    .reader .hint{font-size:.8rem}
    .levels button{padding:7px 12px;font-size:.85rem}
  }
  @media(prefers-reduced-motion:reduce){.card.deal{animation:none}.inner{transition:none}}
</style>
</head>
<body>
<div class="top">
  <a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2 4 8l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Todos os jogos
  </a>
</div>

<header>
  <h1><svg viewBox="-12 -16 24 32" aria-hidden="true"><rect x="-4" y="-14" width="8" height="20" rx="4" fill="#fff" stroke="#c2410c" stroke-width="1.6"/><circle cx="0" cy="8" r="6.5" fill="#f97316"/><rect x="-1.6" y="-8" width="3.2" height="14" rx="1.6" fill="#f97316"/></svg>
  Memória <span class="spark">Climática</span></h1>
  <p class="sub">Junte cada desenho com a sua definição. Arraste as cartas para arrumar a mesa.</p>
</header>

<div class="levels">
  <button id="btnBasico" class="active" onclick="setLevel('basico')">Básico</button>
  <button id="btnInter" onclick="setLevel('inter')">Intermediário</button>
  <button id="btnDificil" onclick="setLevel('dificil')">Difícil</button>
</div>

<div class="hud">
  <span>Pares: <b id="pairs">0</b>/<span id="total">8</span></span>
  <span>Erros: <b id="errors">0</b></span>
  <span>Tempo: <b id="timer">0s</b></span>
  <button class="mini" type="button" onclick="restart()">Embaralhar</button>
</div>

<div class="mesa"><div class="board" id="board"></div></div>

<div class="reader" id="reader" aria-live="polite"></div>

<div class="win" id="win">
  <h2>Você completou!</h2>
  <p id="winMsg"></p>
  <div class="savebox">
    <input id="playerName" maxlength="20" placeholder="Seu nome (até 20 letras)">
    <button class="btn" id="saveBtn" onclick="saveScore()">Salvar no ranking</button>
  </div>
  <p id="saveStatus" style="margin-top:8px;font-size:.85rem"></p>
  <button class="btn ghost" style="margin-top:10px" onclick="restart()">Jogar de novo</button>
</div>

<div class="ranking" id="rankingBox">
  <h3>Ranking Global, nível <span id="rankLevel">Básico</span></h3>
  <ol id="rankList"><li><span>Carregando o ranking...</span></li></ol>
  <p class="note" id="rankNote"></p>
</div>

<footer>
  Clima e Tempo · Jogo da Memória<br>
  <span class="credit">Idealizado por Ernandes Sobreira</span>
</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbXi3UCVl8oLleBzGb6DqWSxbZmZU2yDQ",
  authDomain: "jogos-ranking.firebaseapp.com",
  databaseURL: "https://jogos-ranking-default-rtdb.firebaseio.com",
  projectId: "jogos-ranking",
  storageBucket: "jogos-ranking.firebasestorage.app",
  messagingSenderId: "958784915420",
  appId: "1:958784915420:web:4212d3ad278f02d600f119"
};
const GAME_ID = "2026-06-06-memoria-climatica";

/* ---------- desenhos das cartas (SVG, viewBox 64x64) ---------- */
const svg = inner => `<svg viewBox="0 0 64 64" aria-hidden="true">${inner}</svg>`;
const cloud = (x,y,s=1,f='#cbd5e1') => `<g transform="translate(${x} ${y}) scale(${s})" fill="${f}"><circle cx="10" cy="14" r="9"/><circle cx="22" cy="11" r="11"/><circle cx="33" cy="15" r="8"/><rect x="2" y="13" width="38" height="11" rx="5.5"/></g>`;
const drop = (x,y,s=1,f='#0ea5e9') => `<path transform="translate(${x} ${y}) scale(${s})" d="M0-9C4-3 6 0 6 3a6 6 0 0 1-12 0C-6 0-4-3 0-9z" fill="${f}"/>`;
const sun = (x,y,r=8) => {
  let rays='';
  for(let i=0;i<8;i++){const a=i*Math.PI/4,c=Math.cos(a),s=Math.sin(a);
    rays+=`M${(x+c*(r+3)).toFixed(1)} ${(y+s*(r+3)).toFixed(1)}L${(x+c*(r+7)).toFixed(1)} ${(y+s*(r+7)).toFixed(1)}`;}
  return `<path d="${rays}" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fbbf24"/>`;
};
const arrow = (x1,y1,x2,y2,c='#0ea5e9',w=3.2) => {
  const a=Math.atan2(y2-y1,x2-x1),h=w*2.1;
  const p=(d,k)=>`${(x2-Math.cos(a+d)*h*k).toFixed(1)} ${(y2-Math.sin(a+d)*h*k).toFixed(1)}`;
  return `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><path d="M${p(.55,1)}L${x2} ${y2}L${p(-.55,1)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
};
const waves = (y,f='#38bdf8') => `<path d="M2 ${y}q7.5-6 15 0t15 0 15 0 15 0V62H2z" fill="${f}"/>`;
const tree = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-2" y="0" width="4" height="12" fill="#92400e"/><circle cx="0" cy="-6" r="10" fill="#22c55e"/><circle cx="-6" cy="0" r="6" fill="#16a34a"/><circle cx="6" cy="0" r="6" fill="#4ade80"/></g>`;
const soil = (y,f='#c08457') => `<rect x="2" y="${y}" width="60" height="${62-y}" fill="${f}"/><rect x="2" y="${y-4}" width="60" height="6" rx="2" fill="#4ade80"/>`;
const fish = (x,y,s=1,f='#f59e0b') => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-9 0c4-6 12-6 16 0-4 6-12 6-16 0z" fill="${f}"/><path d="M-9 0l-6-5v10z" fill="${f}"/><circle cx="3" cy="-1" r="1.3" fill="#0f2f44"/></g>`;

const thermo = (x,y,s=1,lvl=.6,f='#ef4444') => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-5" y="-24" width="10" height="34" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="-2.2" y="${(-20+28*(1-lvl)).toFixed(1)}" width="4.4" height="${(28*lvl+4).toFixed(1)}" rx="2.2" fill="${f}"/><circle cx="0" cy="14" r="8" fill="${f}" stroke="#64748b" stroke-width="2"/></g>`;
const globe = (cx,cy,r,ocean='#38bdf8',land='#22c55e') => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${ocean}"/><path d="M${cx-r*.55} ${cy-r*.5}c${r*.3} ${-r*.2} ${r*.5} ${r*.1} ${r*.45} ${r*.4}s${-r*.35} ${r*.25} ${-r*.15} ${r*.6}c${-r*.35} ${-r*.05} ${-r*.5} ${-r*.5} ${-r*.3} ${-r}z M${cx+r*.15} ${cy+r*.05}c${r*.35} ${-r*.1} ${r*.55} ${r*.2} ${r*.4} ${r*.55}s${-r*.45} ${r*.2} ${-r*.45} ${-r*.1}z" fill="${land}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0369a1" stroke-width="2"/>`;
const flake = (x,y,s=1,c='#7dd3fc') => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><path d="M0-8v16M-7-4l14 8M-7 4l14-8M0-8l-3-3M0-8l3-3M0 8l-3 3M0 8l3 3"/></g>`;
const bldg = (x,y,w,h,f='#94a3b8') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/><g fill="#e0f2fe">${Array.from({length:Math.floor(h/9)},(_, i)=>`<rect x="${x+3}" y="${y+4+i*9}" width="${w/2-4}" height="4"/><rect x="${x+w/2+1}" y="${y+4+i*9}" width="${w/2-4}" height="4"/>`).join('')}</g>`;
const ART = {
  "Termômetro": svg(thermo(32,34,1.25,.65)+`<path d="M44 14h6M44 22h4M44 30h6M44 38h4" stroke="#64748b" stroke-width="2"/>`),
  "Clima": svg(`<rect x="6" y="6" width="52" height="52" rx="6" fill="#fff" stroke="#c2410c" stroke-width="2.4"/><path d="M6 18h52" stroke="#c2410c" stroke-width="2.4"/><g fill="#fdba74">${[0,1,2,3].map(r=>[0,1,2,3].map(c=>`<rect x="${11+c*12}" y="${23+r*9}" width="8" height="5" rx="1"/>`).join('')).join('')}</g><path d="M14 4v8M50 4v8" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>`),
  "Tempo": svg(sun(18,20,8)+cloud(20,20,1.05,'#cbd5e1')+`<path d="M26 48l-3 7M38 48l-3 7" stroke="#0ea5e9" stroke-width="3.6" stroke-linecap="round"/>`),
  "Estações": svg(`<circle cx="32" cy="32" r="27" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><path d="M32 5a27 27 0 0 1 27 27H32z" fill="#bbf7d0"/><path d="M59 32a27 27 0 0 1-27 27V32z" fill="#fde68a"/><path d="M32 59A27 27 0 0 1 5 32h27z" fill="#fdba74"/><path d="M5 32A27 27 0 0 1 32 5v27z" fill="#bae6fd"/>`+tree(45,20,.6)+sun(45,45,5)+`<path d="M14 49c2-4 6-5 8-1-3 0-6 1-8 1z" fill="#c2410c"/>`+flake(18,19,.8)),
  "Sol": svg(sun(32,32,14)),
  "Geada": svg(`<rect x="2" y="40" width="60" height="22" rx="3" fill="#bbf7d0"/><path d="M6 40l4-10 4 10M18 40l4-12 4 12M32 40l4-10 4 10M46 40l4-12 4 12" stroke="#16a34a" stroke-width="2.4" fill="none"/><path d="M2 40h60" stroke="#e0f2fe" stroke-width="5"/>`+flake(16,16,.9)+flake(32,10,.8)+flake(48,18,.9)),
  "Sombra": svg(sun(52,10,6)+`<ellipse cx="26" cy="54" rx="20" ry="5" fill="#64748b" opacity=".35"/>`+tree(24,34,1.35)+`<rect x="2" y="56" width="60" height="6" rx="2" fill="#86efac"/>`),
  "Agasalho": svg(`<path d="M22 10h20l12 8-6 10-4-3v31H20V25l-4 3-6-10z" fill="#f97316" stroke="#9a3412" stroke-width="2" stroke-linejoin="round"/><path d="M26 10c2 5 10 5 12 0" fill="none" stroke="#9a3412" stroke-width="2"/><path d="M32 16v40" stroke="#9a3412" stroke-width="1.6" stroke-dasharray="3 3"/>`+flake(10,48,.7)+flake(54,48,.7)),

  "Albedo": svg(sun(10,10,6)+`<rect x="2" y="44" width="28" height="18" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.6"/><rect x="34" y="44" width="28" height="18" fill="#166534"/>`+arrow(14,16,16,42,'#f59e0b',2.6)+arrow(16,42,26,22,'#f59e0b',2.6)+arrow(24,14,46,42,'#f59e0b',2.6)+`<path d="M46 50c0-3 4-3 4 0" stroke="#f97316" stroke-width="2.2" fill="none"/>`),

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildDeck(){
  const cards=[];
  DATA[level].forEach((p,i)=>{
    cards.push({id:i,kind:'term',label:p.t});
    cards.push({id:i,kind:'def',label:p.d});
  });
  return shuffle(cards);
}

/* mesa livre: escolhe linhas x colunas que dividem o baralho sem sobra,
   define o tamanho da carta e sorteia posicao e giro de cada uma */
let zTop=100, TABLE={tw:0,th:0,w:0,h:0};
const rnd=()=>Math.random()*2-1;

function layout(deal){
  const n=deck.length, board=$('board'), mesa=board.parentElement;
  const small=window.innerWidth<=560;
  const mesaPad=small?12:22, bodyPad=small?8:14;
  const Wt=Math.min(window.innerWidth-2*bodyPad,1054)-2*mesaPad;
  const top=mesa.getBoundingClientRect().top+window.scrollY;
  const Hav=Math.max(300,window.innerHeight-top-2*mesaPad-(small?132:118));
  const R=1.32, MAXW=150, MINW=small?54:84, m=small?7:14;
  const ov=small?0.45:0.28;            /* sobreposicao vertical maxima entre fileiras */
  let best=null;
  for(let c=10;c>=2;c--){            /* em empate, prefere mais colunas */
    if(n%c)continue;
    const r=n/c;
    const wByW=(Wt-2*m)/c-(small?5:10);
    const hMax=(Hav-2*m)/(1+(1-ov)*(r-1));
    const w=Math.min(MAXW,wByW,hMax/R);
    if(!best||w>best.w) best={c,r,w,wByW};
  }
  const c=best.c, r=best.r;
  const w=Math.floor(Math.max(Math.min(MINW,best.wByW),best.w)), h=w*R;
  const tw=Math.min(Wt,c*(w+(small?8:24))+2*m);
  const natural=r*(h+(small?10:20))+2*m;
  const tight=2*m+h*(1+(1-ov)*(r-1));
  const th=Math.round(Math.max(tight,Math.min(Hav,natural)));
  const stepX=c>1?(tw-2*m-w)/(c-1):0, stepY=r>1?(th-2*m-h)/(r-1):0;
  const jx=Math.max(2,Math.min(small?5:11,(stepX-w)/2+4)), jy=small?5:9;
  const rot=small?8:(n>16?9:11);
  TABLE={tw,th,w,h};
  const st=document.documentElement.style;
  st.setProperty('--tw',tw+'px'); st.setProperty('--th',th+'px');
  st.setProperty('--cw',w+'px');
  st.setProperty('--fs',Math.max(8.5,Math.min(14.5,w*0.108)).toFixed(1)+'px');
  [...board.children].forEach((el,i)=>{
    const col=i%c,row=Math.floor(i/c);
    setPos(el,m+col*stepX+rnd()*jx,m+row*stepY+rnd()*jy);
    el.style.setProperty('--r',(rnd()*rot).toFixed(1)+'deg');
    el.style.setProperty('--z',i+1);
    el.style.setProperty('--sx',(tw/2-w/2).toFixed(0)+'px');
    el.style.setProperty('--sy',(th-h*0.35).toFixed(0)+'px');
    el.style.setProperty('--d',(i*(n>16?34:55))+'ms');
    el.classList.toggle('deal',!!deal);
  });
  zTop=100;
}
function setPos(el,x,y){
  const T=TABLE;
  el._x=Math.max(-T.w*0.25,Math.min(T.tw-T.w*0.75,x));
  el._y=Math.max(-T.h*0.25,Math.min(T.th-T.h*0.75,y));
  el.style.setProperty('--x',el._x.toFixed(1)+'px');
  el.style.setProperty('--y',el._y.toFixed(1)+'px');
}

/* arrastar: puxa a carta de cima da outra; toque curto continua virando a carta */
function makeDraggable(el){
  let g=null;
  el.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    g={px:e.clientX,py:e.clientY,ox:el._x,oy:el._y,moved:false,id:e.pointerId};
    try{el.setPointerCapture(e.pointerId);}catch(_){}
  });
  el.addEventListener('pointermove',e=>{
    if(!g||e.pointerId!==g.id)return;
    const dx=e.clientX-g.px, dy=e.clientY-g.py;
    if(!g.moved){
      if(Math.hypot(dx,dy)<8)return;
      g.moved=true; el.classList.remove('deal'); el.classList.add('drag');
    }
    setPos(el,g.ox+dx,g.oy+dy);
  });
  const end=e=>{
    if(!g||e.pointerId!==g.id)return;
    if(g.moved){
      el.classList.remove('drag');
      el.style.setProperty('--z',++zTop);
      el._dragged=true; setTimeout(()=>{el._dragged=false;},60);
    }
    g=null;
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}

function render(deal){
  const board=$('board');
  board.innerHTML='';
  deck.forEach((c,idx)=>{
    const el=document.createElement('button');
    el.type='button';
    el.className='card';
    el.setAttribute('aria-label','Carta '+(idx+1)+', virada para baixo');
    const back=c.kind==='term'
      ? `<div class="face back term"><div class="art">${ART[c.label]||''}</div><div class="lbl">${esc(c.label)}</div></div>`
      : `<div class="face back def">${esc(c.label)}</div>`;
    el.innerHTML=`<div class="inner"><div class="face front">${BACK_ART}</div>${back}</div>`;
    el.addEventListener('click',()=>{ if(el._dragged){el._dragged=false;return;} flip(idx,el); });
    makeDraggable(el);
    board.appendChild(el);
  });
  $('total').textContent=DATA[level].length;
  layout(deal);
  fitText();
}

/* reduz a fonte so das cartas cujo texto nao cabe */
function fitText(){
  document.querySelectorAll('#board .back.def, #board .lbl').forEach(el=>{
    el.style.fontSize='';
    const box=el.classList.contains('lbl')?el.parentElement:el;
    let fs=parseFloat(getComputedStyle(el).fontSize), n=0;
    const over=()=>box.scrollHeight>box.clientHeight+1||el.scrollWidth>el.clientWidth+1;
    while(over()&&fs>6.5&&n++<24){fs-=0.5;el.style.fontSize=fs+'px';}
  });
}

function startTimer(){
  if(startTime)return;
  startTime=Date.now();
  timerInt=setInterval(()=>{
    elapsed=Math.floor((Date.now()-startTime)/1000);
    $('timer').textContent=elapsed+'s';
  },500);
}

function rowHtml(c){
  return `<div class="row"><span class="tag ${c.kind==='def'?'d':''}">${c.kind==='def'?'Definição':'Conceito'}</span><span>${esc(c.label)}</span></div>`;
}
function setReader(html){ $('reader').innerHTML=html; }

function closePending(){
  if(!pendingClose)return;
  clearTimeout(pendingTimer);
  const f=pendingClose; pendingClose=null; pendingTimer=null; f();
}

function flip(idx,el){
  if(pendingClose) closePending();
  if(lock||el.classList.contains('flip')||el.classList.contains('matched'))return;
  startTimer();
  el.classList.add('flip');
  el.setAttribute('aria-label',deck[idx].label);
  if(!firstCard){
    firstCard={idx,el};
    setReader(rowHtml(deck[idx])+`<div class="hint" style="margin-top:6px">Agora vire a carta que combina com esta.</div>`);
    return;
  }
  const a=deck[firstCard.idx], b=deck[idx], first=firstCard;
  if(a.id===b.id){
    lock=true;
    const p=DATA[level][a.id];
    setReader(`<div class="msg ok" style="margin-top:0">Par certo: ${esc(p.t)}</div><div>${esc(p.d)}</div><div class="exp">${esc(p.e)}</div>`);
    setTimeout(()=>{
      first.el.classList.add('matched');el.classList.add('matched');
      matched++;$('pairs').textContent=matched;
      firstCard=null;lock=false;
      if(matched===DATA[level].length)win();
    },450);
  }else{
    errors++;$('errors').textContent=errors;
    first.el.classList.add('wrong');el.classList.add('wrong');
    setReader(rowHtml(a)+rowHtml(b)+`<div class="msg no">Não formam par. <span class="hint">Toque em outra carta para continuar.</span></div>`);
    firstCard=null;
    /* tempo de leitura proporcional ao tamanho do texto; tocar em outra carta fecha antes */
    const ms=Math.min(6000,1800+(a.label.length+b.label.length)*38);
    pendingClose=()=>{
      [first.el,el].forEach(x=>{x.classList.remove('flip','wrong');x.setAttribute('aria-label','Carta virada para baixo');});
    };
    pendingTimer=setTimeout(closePending,ms);
  }
}

function win(){
  clearInterval(timerInt);
  $('winMsg').textContent=`Nível ${LEVEL_NAMES[level]}: ${DATA[level].length} pares, ${errors} erro(s), ${elapsed}s. Coloque seu nome e entre para o Ranking Global.`;
  $('saveStatus').textContent='';
  $('saveBtn').disabled=false;
  scoreSaved=false;
  const w=$('win');
  w.classList.add('show');
  w.scrollIntoView({behavior:'smooth',block:'center'});
}

function restart(){
  clearInterval(timerInt);clearTimeout(pendingTimer);pendingClose=null;pendingTimer=null;
  startTime=null;elapsed=0;
  deck=buildDeck();firstCard=null;lock=false;matched=0;errors=0;
  $('pairs').textContent=0;
  $('errors').textContent=0;
  $('timer').textContent='0s';
  setReader(`<div class="hint" style="font-size:1rem">${HINT_START}</div>`);
  $('win').classList.remove('show');
  render(true);
}

let resizeT=null;
window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{layout(false);fitText();},150);});

/* ---------- ranking (Firestore) ---------- */
async function initFirebase(){
  try{
    const appM=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fsM=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app=appM.initializeApp(firebaseConfig);
    db=fsM.getFirestore(app);
    fsFns=fsM;
    fbState='ok';
    loadRanking();
  }catch(e){
    fbState='off';
    $('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';
    $('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';
  }
}

function scoreOf(err,sec){return err*1000+sec;}

async function saveScore(){
  if(scoreSaved)return;
  const name=$('playerName').value.trim();
  const st=$('saveStatus');
  if(!name){st.textContent='Digite seu nome primeiro.';return;}
  if(!db){st.textContent='Sem conexão com o ranking. Seu resultado não foi enviado.';return;}
  try{
    $('saveBtn').disabled=true;
    await fsFns.addDoc(
      fsFns.collection(db,'games',GAME_ID,'scores'),
      {name:name.slice(0,20),score:scoreOf(errors,elapsed),errors:errors,seconds:elapsed,
       level:level,ts:fsFns.serverTimestamp()}
    );
    scoreSaved=true;
    st.textContent='Salvo no Ranking Global!';
    loadRanking();
  }catch(e){
    $('saveBtn').disabled=false;
    st.textContent='Erro ao salvar. Verifique a internet e tente de novo.';
  }
}

async function loadRanking(){
  if(!db)return;
  const list=$('rankList'), asked=level;
  try{
    /* filtra por nível no servidor e ordena aqui: cada nível tem o seu ranking completo,
       sem depender de índice composto no Firestore */
    const q=fsFns.query(
      fsFns.collection(db,'games',GAME_ID,'scores'),
      fsFns.where('level','==',asked), fsFns.limit(1000)
    );
    const snap=await fsFns.getDocs(q);
    if(asked!==level)return;
    const rows=[];
    snap.forEach(d=>rows.push(d.data()));
    rows.sort((a,b)=>(a.score-b.score));
    if(!rows.length){list.innerHTML='<li><span>Seja o primeiro do ranking!</span></li>';return;}
    list.innerHTML=rows.slice(0,10).map((r,i)=>
      `<li><span><span class="pos">${i+1}º</span>${esc(r.name)}</span><span>${Number(r.errors)||0} erro(s) · ${Number(r.seconds)||0}s</span></li>`
    ).join('');
  }catch(e){
    list.innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>';
  }
}

restart();
initFirebase();
</script>
